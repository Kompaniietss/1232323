[env:mega]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++1z

[env:native]
platform = native
test_framework = unity
build_flags = -std=gnu++17

[env:bench]
platform = atmelavr
board = megaatmega2560
framework = arduino
monitor_speed = 115200
build_unflags = -std=gnu++11
build_flags = -std=gnu++1z
build_src_filter = +<../bench/bench_pricing.cpp>
